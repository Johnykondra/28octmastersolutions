<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Server rack illustration</title>
  <desc id="desc">A pair of neatly arranged rack servers with blue status lights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132944"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#192b41"/>
      <stop offset=".5" stop-color="#344b64"/>
      <stop offset="1" stop-color="#17283c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#14b8a6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
